/**/joint_trajectory_controller:
  ros__parameters:
    joints:
    - robot1_joint_1
    - robot1_joint_2
    - robot1_joint_3
    - robot1_joint_4
    - robot1_joint_5
    - robot1_joint_6
    - robot2_joint_1
    - robot2_joint_2
    - robot2_joint_3
    - robot2_joint_4
    - robot2_joint_5
    - robot2_joint_6

    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true
    update_rate: 250
