name: ROS-Industrial CI jazzy
run-name: ROS-Industrial CI - ${{ github.event_name }}

# This determines when this workflow is run
# on: [push, pull_request] # on all pushes and PRs

# or more fine-grained
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    # Run every Monday at 1PM UTC
    - cron: 0 13 * * 1

permissions:
  contents: read

jobs:
  industrial_ci:
    name: ROS-Industrial CI jazzy
    env:
      ROS_REPO: ros
      BUILDER: colcon
      TARGET_CMAKE_ARGS: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      ADDITIONAL_DEBS: ca-certificates curl jq unzip
      TEST_COVERAGE: true
      UPSTREAM_WORKSPACE: 'github:kuka-ros/kuka_robot_descriptions#master github:kroshu/kuka-external-control-sdk#master'
      ROS_DISTRO: jazzy
      CCACHE_DIR: /github/home/.ccache # Directory for ccache (and how we enable ccache in industrial_ci)
      EVENT_NAME: ${{ github.event_name }}
      BRANCH: ${{ github.event.ref }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BASE: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.number }}
      DEBUG_BASH: false
      AFTER_SETUP_UPSTREAM_WORKSPACE: 'git -C "$HOME/upstream_ws/src/kuka-external-control-sdk" submodule update --init --recursive'
    runs-on: ubuntu-24.04
    steps:
      - name: Reset ANALYZER for scheduled and push runs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || { [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" != "refs/heads/master" ]]; }; then
            echo "ANALYZER=" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive
      # This step will fetch/store the directory used by ccache before/after the ci run
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.env.ROS_DISTRO }}-${{ matrix.env.ROS_REPO }}

      # Run industrial_ci
      - uses: ros-industrial/industrial_ci@125164b9f1883cdf1858897a7146d1bebf2be5c6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DOCKER_RUN_OPTS: >-
            -e SONAR_TOKEN -e EVENT_NAME -e BRANCH
            -e PR_BRANCH -e PR_BASE -e PR_NUMBER
          AFTER_SCRIPT: |
            if [[ "$EVENT_NAME" != "schedule" ]]; then
              rosenv bash "$TARGET_REPO_PATH/.ci/sonar.sh" "$BASEDIR/${PREFIX}target_ws" "$TARGET_REPO_NAME"
            fi
